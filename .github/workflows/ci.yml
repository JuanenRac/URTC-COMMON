name: URTC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Baseline (Python, project validation and compilation of the sources)
        uses: ./.github/actions/urtc-baseline
      - name: Set up Node (runs the generated TypeScript against the vectors)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Static checks (unused names, exception chaining, syntax)
        run: |
          python -m pip install "ruff==0.17.1"
          ruff check .
      - name: Check the generated files are current
        run: |
          python tools/generate_constants.py --check
          python tools/make_conformance.py --check
          python tools/generate_tools.py --check
          python tools/make_extra_vectors.py --check
          python tools/compat_table.py --check
          python tools/status_table.py --check
      - name: Check the release files build the same bytes twice and run apart from the checkout
        run: |
          python tools/make_release_artifacts.py reproduce
          python tools/make_release_artifacts.py build --out release-files --no-sign
          python tools/make_release_artifacts.py smoke release-files
      - name: Install and run the real Python test suite
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m mypy
          python -m pytest tests/ -q --cov=urtc_common
      - name: Run the vectors through the package and through the generated TypeScript
        run: |
          python -m urtc_common.cli conformance
          node tests/ts/run_vectors.mjs

  windows:
    name: Tests on Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run the tests (line endings and .bat scripts behave differently on Windows)
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python tools/generate_constants.py --check
          python tools/make_conformance.py --check
          python tools/generate_tools.py --check
          python tools/make_extra_vectors.py --check
          python tools/compat_table.py --check
          python tools/status_table.py --check
          python -m pytest tests -q
