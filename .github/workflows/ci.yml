name: URTC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up Node (runs the generated TypeScript against the vectors)
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Validate manifest, version, documentation and secret policy
        run: python tools/ci_validate.py
      - name: Static checks (unused names, exception chaining, syntax)
        run: |
          python -m pip install "ruff==0.17.2"
          ruff check .
      - name: Compile Python sources without running versioning build scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          excluded = {".git", ".venv", "node_modules", "dist", "build", "target", "__pycache__"}
          files = [path for path in Path(".").rglob("*.py") if not any(part in excluded for part in path.parts)]
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f"PYTHON_SYNTAX=PASS files={len(files)}")
          PY
      - name: Check the generated files are current
        run: |
          python tools/generate_constants.py --check
          python tools/make_conformance.py --check
          python tools/generate_tools.py --check
          python tools/make_extra_vectors.py --check
          python tools/compat_table.py --check
      - name: Install and run the real Python test suite
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest tests/ -q --cov=urtc_common
      - name: Run the vectors through the package and through the generated TypeScript
        run: |
          python -m urtc_common.cli conformance
          node tests/ts/run_vectors.mjs

  windows:
    name: Tests on Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run the tests (line endings and .bat scripts behave differently on Windows)
        run: |
          python -m pip install -e ".[dev]"
          python tools/generate_constants.py --check
          python tools/make_conformance.py --check
          python tools/generate_tools.py --check
          python tools/make_extra_vectors.py --check
          python tools/compat_table.py --check
          python -m pytest tests -q
