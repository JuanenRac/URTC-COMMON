[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "urtc-common"
version = "0.0.3"
description = "The URTC CAN protocol as data: a machine-readable specification, generated constants and frame codecs for C, Python and TypeScript, shared conformance vectors and a shared Python transport layer."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "JuanenRac (Electro Hobby 3D)", email = "electrohobby3d@gmail.com" },
]
keywords = ["urtc", "can-bus", "slcan", "socketcan", "protocol", "conformance"]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
can = ["python-can>=4.0"]
dev = ["pytest>=8.0", "jsonschema>=4.0"]

[project.urls]
Homepage = "https://github.com/JuanenRac/URTC-COMMON"

[project.scripts]
urtc-common = "urtc_common.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools", "tests"]
