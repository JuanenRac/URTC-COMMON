[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "urtc-common"
version = "0.1.0"
description = "The URTC CAN protocol as data: a machine-readable specification, generated constants and frame codecs for C, Python and TypeScript, shared conformance vectors and a shared Python transport layer."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "JuanenRac (Electro Hobby 3D)", email = "electrohobby3d@gmail.com" },
]
keywords = ["urtc", "can-bus", "slcan", "socketcan", "protocol", "conformance"]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
can = ["python-can>=4.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "jsonschema>=4.0", "pyserial>=3.5", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/JuanenRac/URTC-COMMON"

[project.scripts]
urtc-common = "urtc_common.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
# the shared picture tools are copied from the family's canonical copy and are not edited (or linted) here
exclude = ['^tools/(_readme_svg|make_architecture|make_structure)\.py$']
files = ["src/urtc_common", "src/urtc_ui"]
# pyserial and python-can ship no type information
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools", "tests"]

[tool.coverage.report]
# measured 85 percent of the package; the floor is eight points below so a real drop fails the CI
fail_under = 77
